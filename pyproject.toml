[project]
name = "network-investigation-agent"
version = "0.1.0"
description = "Network Investigation Agent for Root Cause Analysis using LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60,<0.3",
    "langchain>=0.3.7,<0.4",
    "langchain-core>=0.3.15,<0.4",
    "langchain-openai>=0.2.9,<0.3",
    "langchain-anthropic>=0.3.0,<0.4",
    "langchain-google-genai>=2.0.4,<3",
    "langchain-huggingface>=0.1.2,<0.2",
    "langsmith>=0.1.147,<0.2",
    "duckdb>=1.1.0,<2.0",
    "pandas>=2.2.2,<3",
    "python-dotenv>=1.0.1,<2",
    "rich>=13.9.2,<14",
    "fastapi>=0.115.0,<1.0",
    "uvicorn>=0.32.0,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "pydantic>=2.9.0,<3.0",
    "httpx>=0.27.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.2.5,<5",
    "ipykernel>=6.29.5,<7",
    "pytest>=8.0.0,<9.0",
    "black>=24.0.0,<25.0",
    "ruff>=0.6.0,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starter_code"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
